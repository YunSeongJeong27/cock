spring:
  application:
    name: depositcock
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        # 지연 로딩 N+1 완화 (주문 목록 → 주문 상품, 픽업 지점 등을 묶어서 읽음)
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Seoul

server:
  error:
    # 예상 못 한 오류의 내부 메시지는 응답에 넣지 않는다 (ApiExceptionHandler 가 ProblemDetail 로 응답)
    include-message: never
    include-stacktrace: never

app:
  zone: Asia/Seoul
  # JWT 서명 키. 운영에서는 반드시 환경변수 APP_JWT_SECRET 로 32바이트 이상 값을 넣는다.
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-ttl-hours: 168
  cookie-secure: false
  trial-days: 30
  # 최초 관리자 계정. 비어 있으면 만들지 않는다.
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  # 공개 주문 API: IP 하나당 1분에 허용하는 요청 수
  public-rate-limit-per-minute: 60
  # 본인 확인·주문 취소: (IP + 공구)마다 10분에 허용하는 요청 수 (뒷4자리 대입 방지)
  sensitive-rate-limit-per-10-minutes: 20
  vision:
    # fake | anthropic
    provider: ${APP_VISION_PROVIDER:fake}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${APP_VISION_MODEL:claude-haiku-5-5}
    # 판매자별 하루 캡처(이미지) 장수 기본 제한. 관리자 화면에서 판매자별로 바꿀 수 있다.
    daily-capture-limit: ${APP_VISION_DAILY_CAPTURE_LIMIT:30}
