spring:
  application:
    name: depositcock
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Seoul

server:
  error:
    include-message: always

app:
  zone: Asia/Seoul
  # JWT 서명 키. 운영에서는 반드시 환경변수 APP_JWT_SECRET 로 32바이트 이상 값을 넣는다.
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-ttl-hours: 168
  cookie-secure: false
  trial-days: 30
  # 최초 관리자 계정. 비어 있으면 만들지 않는다.
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  # 공개 주문 API: IP 하나당 1분에 허용하는 요청 수
  public-rate-limit-per-minute: 60
  vision:
    # fake | anthropic
    provider: ${APP_VISION_PROVIDER:fake}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${APP_VISION_MODEL:claude-sonnet-5-5}
