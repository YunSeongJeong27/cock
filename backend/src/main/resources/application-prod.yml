# 운영용. 값은 전부 환경변수로 넣는다. 깃허브에 비밀값을 올리지 않는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

server:
  # 리버스 프록시(로드밸런서) 뒤에서 실제 고객 IP·https 를 인식 (요청 제한, 쿠키 secure)
  forward-headers-strategy: native

app:
  cookie-secure: true
